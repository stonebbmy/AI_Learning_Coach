server {
    listen 80;
    server_name _;

    # 静态资源根目录（Vite build 产物）
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩（减少 JS/CSS 传输体积）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vue Router history 模式：未匹配的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite build 的 JS/CSS 带 content-hash，可以长期缓存
    location ~* \.(js|css|woff2?|ttf|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 反向代理：Java 业务服务 ──────────────────────────────────────────────
    # 浏览器发 /proxy-java/api/... → nginx 转发到 java-app:8080/api/...
    location /proxy-java/ {
        proxy_pass         http://java-app:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # SSE 流式响应（Java 聊天接口）：禁用缓冲，保持长连接
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # 与 Vite 开发代理一致：/proxy-ai/xxx → ai-service:8000/api/xxx
    # generateOutline 等直调 Python；浏览器只访问 :3000，不映射 ai-service 宿主机端口）
    location /proxy-ai/ {
        proxy_pass         http://ai-service:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_read_timeout 300s;
    }
}
