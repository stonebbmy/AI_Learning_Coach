# 默认「兜底」：DaoCloud 拉取 Docker Hub 镜像；构建期 PyPI/apt/Maven 走国内镜像（见 ai-service/java-app Dockerfile），不依赖 Clash 对 PyPI 的 TLS 稳定性。
# 运行期业务外网仍经 compose 注入的 DOCKER_* 代理（本机 Clash）；详见 docker/NETWORK.txt

services:
  # ---------------- PostgreSQL Database ----------------
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: aicoach_postgres
    environment:
      POSTGRES_DB: ai_coach
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ai_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Redis Cache ----------------
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: aicoach_redis
    ports:
      - "6379:6379"
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Chroma Vector Database ----------------
  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:0.4.24
    container_name: aicoach_chroma
    ports:
      - "8001:8000" # 将Chroma的8000端口映射到主机的8001，避免与ai-service冲突
    volumes:
      - ./ai-service/chroma_db:/chroma/.chroma/index # 将持久化目录挂载到容器中
    networks:
      - ai-coach-net
    environment:
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    healthcheck:
      # chroma 镜像不自带 curl/wget，使用 python 内置 urllib 做探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Python AI Service ----------------
  ai-service:
    build:
      context: ./ai-service
      # build 阶段容器默认没有 compose 运行时的 extra_hosts，需单独注入，否则 HTTP_PROXY 里 host.docker.internal 无法解析
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
        - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
        - PYTHON_BASE_IMAGE=${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11.8-slim-bullseye}
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: aicoach_ai_service
    # 部分环境下 host.docker.internal 未注入 /etc/hosts，导致 HTTP_PROXY 无法解析、httpx 报 Name or service not known
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # 从项目根目录的 .env 文件中读取 DEEPSEEK_API_KEY
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 嵌入：硅基流动 + bge-m3（需 SILICONFLOW_API_KEY 或 EMBEDDING_API_KEY / OPENAI_API_KEY）
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_TIKTOKEN_ENABLED=${EMBEDDING_TIKTOKEN_ENABLED:-false}
      # Chroma 拓扑：统一走 remote server（docker compose 中的 chroma 服务）
      - CHROMA_MODE=remote
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Python 侧：会话记忆、精确命中缓存（与 Java 共用同一 Redis 服务）
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Prompt 版本：qa_v1.yaml / qa_v2.yaml
      - PROMPT_QA_VERSION=v1
      # MCP web_fetch 域名白名单（空则使用代码内默认列表）；逗号分隔，可覆盖
      - MCP_WEB_ALLOW_DOMAINS=${MCP_WEB_ALLOW_DOMAINS:-}
      # 可选：Langfuse 追踪（未配置则自动跳过）
      # - LANGFUSE_PUBLIC_KEY=
      # - LANGFUSE_SECRET_KEY=
      # - LANGFUSE_HOST=https://cloud.langfuse.com
      - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - http_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - https_proxy=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - ALL_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - all_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - NO_PROXY=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,redis,postgres,chroma,ai-service,java-app,openaipublic.blob.core.windows.net,api.deepseek.com,api.siliconflow.cn,172.16.0.0/12,172.18.0.0/16}
      - no_proxy=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,redis,postgres,chroma,ai-service,java-app,openaipublic.blob.core.windows.net,api.deepseek.com,api.siliconflow.cn,172.16.0.0/12,172.18.0.0/16}
    networks:
      - ai-coach-net
    healthcheck:
      # ai-service 镜像也未必安装 curl，直接用 python 探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------- Java Business Service ----------------
  java-app:
    build:
      context: ./java-app
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
        - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
        - JAVA_BUILD_IMAGE=${JAVA_BUILD_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jdk-jammy}
        - JAVA_RUN_IMAGE=${JAVA_RUN_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jre-jammy}
    container_name: aicoach_java_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 覆盖 application.yml 中的配置，使其在 Docker 网络中正常工作
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_coach
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-service:8000/api
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - http_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - https_proxy=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - ALL_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - all_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - NO_PROXY=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,ai-service,postgres,redis,java-app,chroma,172.16.0.0/12,172.18.0.0/16}
      - no_proxy=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,ai-service,postgres,redis,java-app,chroma,172.16.0.0/12,172.18.0.0/16}
    networks:
      - ai-coach-net
    healthcheck:
      # Spring Boot Actuator 的健康检查端点
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10

# ---------------- Network Definition ----------------
networks:
  ai-coach-net:
    driver: bridge

# ---------------- Volume Definition ----------------
volumes:
  postgres_data:
    driver: local
