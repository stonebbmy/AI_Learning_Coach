# 默认「兜底」：DaoCloud 拉取 Docker Hub 镜像；构建期 PyPI/apt/Maven 走国内镜像（见 ai-service/java-app Dockerfile），不依赖 Clash 对 PyPI 的 TLS 稳定性。
# 运行期业务外网仍经 compose 注入的 DOCKER_* 代理（本机 Clash）；详见 docker/NETWORK.txt

services:
  # ---------------- PostgreSQL Database ----------------
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
    container_name: aicoach_postgres
    environment:
      POSTGRES_DB: ai_coach
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ai_coach"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Redis Cache ----------------
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: aicoach_redis
    ports:
      - "6379:6379"
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------- Chroma Vector Database ----------------
  chroma:
    image: docker.m.daocloud.io/chromadb/chroma:0.4.24
    container_name: aicoach_chroma
    ports:
      - "8001:8000" # 将Chroma的8000端口映射到主机的8001，避免与ai-service冲突
    # 官方 chromadb/chroma 镜像默认持久化目录为 WORKDIR(/chroma) 下的 ./chroma，即容器内 /chroma/chroma（见镜像内 docker-compose.server.example.yml）
    # 误挂 /chroma/.chroma/index 时数据仍写在 /chroma/chroma，宿主机卷不会生效
    volumes:
      - ./ai-service/chroma_db:/chroma/chroma
    networks:
      - ai-coach-net
    environment:
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    healthcheck:
      # chroma 镜像不自带 curl/wget，使用 python 内置 urllib 做探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Python AI Service ----------------
  ai-service:
    build:
      context: ./ai-service
      # build 阶段容器默认没有 compose 运行时的 extra_hosts，需单独注入，否则 HTTP_PROXY 里 host.docker.internal 无法解析
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
        - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
        - PYTHON_BASE_IMAGE=${PYTHON_BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11.8-slim-bullseye}
        - PIP_INDEX_URL=${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST:-pypi.tuna.tsinghua.edu.cn}
    container_name: aicoach_ai_service
    # 部分环境下 host.docker.internal 未注入 /etc/hosts，导致 HTTP_PROXY 无法解析、httpx 报 Name or service not known
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # 从项目根目录的 .env 文件中读取 DEEPSEEK_API_KEY
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 嵌入：硅基流动 + bge-m3（需 SILICONFLOW_API_KEY 或 EMBEDDING_API_KEY / OPENAI_API_KEY）
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_API_BASE=${EMBEDDING_API_BASE:-https://api.siliconflow.cn/v1}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      - EMBEDDING_TIKTOKEN_ENABLED=${EMBEDDING_TIKTOKEN_ENABLED:-true}
      # Chroma 拓扑：统一走 remote server（docker compose 中的 chroma 服务）
      - CHROMA_MODE=remote
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # Python 侧：会话记忆、精确命中缓存（与 Java 共用同一 Redis 服务）
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Prompt 版本：qa_v1.yaml / qa_v2.yaml
      - PROMPT_QA_VERSION=v1
      # MCP web_fetch 域名白名单（空则使用代码内默认列表）；逗号分隔，可覆盖
      - MCP_WEB_ALLOW_DOMAINS=${MCP_WEB_ALLOW_DOMAINS:-}
      # 可选：Langfuse 追踪（未配置则自动跳过）
      # - LANGFUSE_PUBLIC_KEY=
      # - LANGFUSE_SECRET_KEY=
      # - LANGFUSE_HOST=https://cloud.langfuse.com
      - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - http_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - https_proxy=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - ALL_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - all_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - NO_PROXY=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,redis,postgres,chroma,ai-service,java-app,openaipublic.blob.core.windows.net,api.deepseek.com,api.siliconflow.cn,172.16.0.0/12,172.18.0.0/16}
      - no_proxy=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,redis,postgres,chroma,ai-service,java-app,openaipublic.blob.core.windows.net,api.deepseek.com,api.siliconflow.cn,172.16.0.0/12,172.18.0.0/16}
    networks:
      - ai-coach-net
    # ai-service 不再对外暴露端口：所有外部访问统一经 Java BFF (:8080) 转发，消除双入口
    # ports:
    #   - "8000:8000"
    healthcheck:
      # ai-service 镜像也未必安装 curl，直接用 python 探活
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---------------- Java Business Service ----------------
  java-app:
    build:
      context: ./java-app
      extra_hosts:
        - "host.docker.internal:host-gateway"
      args:
        - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
        - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
        - JAVA_BUILD_IMAGE=${JAVA_BUILD_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jdk-jammy}
        - JAVA_RUN_IMAGE=${JAVA_RUN_IMAGE:-docker.m.daocloud.io/library/eclipse-temurin:17-jre-jammy}
    container_name: aicoach_java_app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 覆盖 application.yml 中的配置，使其在 Docker 网络中正常工作
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_coach
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis
      - AI_SERVICE_URL=http://ai-service:8000/api
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HTTP_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - HTTPS_PROXY=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - http_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - https_proxy=${DOCKER_HTTPS_PROXY-http://host.docker.internal:7890}
      - ALL_PROXY=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - all_proxy=${DOCKER_HTTP_PROXY-http://host.docker.internal:7890}
      - NO_PROXY=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,ai-service,postgres,redis,java-app,chroma,172.16.0.0/12,172.18.0.0/16}
      - no_proxy=${DOCKER_NO_PROXY:-localhost,127.0.0.1,::1,ai-service,postgres,redis,java-app,chroma,172.16.0.0/12,172.18.0.0/16}
    networks:
      - ai-coach-net
    healthcheck:
      # Spring Boot Actuator 的健康检查端点
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10

  # ---------------- Vue Frontend (Nginx) ----------------
  web:
    build:
      context: ./web
      args:
        - NODE_BASE_IMAGE=${NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        - NGINX_BASE_IMAGE=${NGINX_BASE_IMAGE:-docker.m.daocloud.io/library/nginx:1.25-alpine}
        # 覆盖宿主机/BuildKit 注入的 127.0.0.1:7890，使 npm 在容器内对 npmmirror 直连
        - HTTP_PROXY=
        - HTTPS_PROXY=
        - http_proxy=
        - https_proxy=
    container_name: aicoach_web
    ports:
      - "3000:80"    # 宿主机 3000 → nginx 80
    depends_on:
      java-app:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------- Redis Exporter（将 Redis 指标暴露给 Prometheus）----
  redis-exporter:
    image: docker.m.daocloud.io/oliver006/redis_exporter:v1.61.0
    container_name: aicoach_redis_exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"    # Prometheus 从此端口 scrape
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ai-coach-net
    # 官方镜像为 distroless，无 wget/sh；用二进制自带 -version 作探活（能证明进程可执行；非 HTTP 级检测）
    healthcheck:
      test: ["CMD", "/redis_exporter", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------- Prometheus Metrics Scraper ----------------
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.51.2
    container_name: aicoach_prometheus
    # 宿主机/ Docker 可能注入 127.0.0.1:7890 代理；容器内无该端口，wget 健康检查会失败，抓内部 target 也易被误走代理
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      ai-service:
        condition: service_healthy
      redis-exporter:
        condition: service_healthy
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------- Grafana Visualization ----------------
  grafana:
    image: docker.m.daocloud.io/grafana/grafana:10.4.2
    container_name: aicoach_grafana
    environment:
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - http_proxy=
      - https_proxy=
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # 允许在本地前端 (如 Vite) iframe 中嵌入 Grafana UI
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # 禁止 Grafana 向外发送遥测数据
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"    # 宿主机 3001 避免与前端 3000 冲突
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - ai-coach-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ---------------- Network Definition ----------------
networks:
  ai-coach-net:
    driver: bridge

# ---------------- Volume Definition ----------------
volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
